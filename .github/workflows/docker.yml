name: docker

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image tags
        run: |
          RUST_VERSION="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)"
          echo "RUST_MAJOR=${RUST_VERSION%%.*}" >> "$GITHUB_ENV"
          echo "RUST_MINOR=${RUST_VERSION%.*}" >> "$GITHUB_ENV"
          echo "RUST_FULL=${RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.RUST_MAJOR }}
            ${{ env.IMAGE }}:${{ env.RUST_MINOR }}
            ${{ env.IMAGE }}:${{ env.RUST_FULL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm "${IMAGE}:latest" sh -c 'rustc --version && cargo --version && rustfmt --version && cargo clippy --version && protoc --version && node --version && npm --version && npx --version && prettier --version && git --version && make --version && pkg-config --version'
